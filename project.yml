name: ProPTAsistani
options:
  bundleIdPrefix: com.must
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.14.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  ProPTAsistani:
    build:
      targets:
        ProPTAsistani: all
        ProPTWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ProPTAsistani:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProPTAsistani
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.must.proptasistani
        INFOPLIST_FILE: ProPTAsistani/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProPTAsistani/ProPTAsistani.entitlements
    dependencies:
      - target: ProPTWidget
        embed: true
      - package: GoogleMobileAds
        product: GoogleMobileAds

  ProPTWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProPTWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.must.proptasistani.widget
        INFOPLIST_FILE: ProPTWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProPTWidgetExtension.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
